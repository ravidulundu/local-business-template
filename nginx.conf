server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = / {
        add_header Link '</index.md>; rel="alternate"; type="text/markdown", </sitemap.xml>; rel="sitemap", </robots.txt>; rel="robots"' always;
        if ($http_accept ~* "text/markdown") {
            rewrite ^ /index.md last;
        }
        try_files /index.html =404;
    }

    location = /index.md {
        types {
            text/markdown md;
        }
        default_type text/markdown;
        add_header x-markdown-tokens "approx=520" always;
        try_files /index.md =404;
    }

    location ~ ^/(roupa-de-santo|saia-de-santo|pano-da-costa)/$ {
        add_header Link '<index.md>; rel="alternate"; type="text/markdown"' always;
        if ($http_accept ~* "text/markdown") {
            rewrite ^/(.*)/$ /$1/index.md last;
        }
        try_files $uri/index.html =404;
    }

    location ~ ^/(roupa-de-santo|saia-de-santo|pano-da-costa)/index\.md$ {
        default_type text/markdown;
        add_header x-markdown-tokens "approx=420" always;
        try_files $uri =404;
    }

    location = /robots.txt {
        default_type text/plain;
        try_files /robots.txt =404;
    }

    location = /sitemap.xml {
        types {
            application/xml xml;
        }
        default_type application/xml;
        try_files /sitemap.xml =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(css|js)$ {
        expires -1;
        add_header Cache-Control "no-cache";
    }

    location ~* \.(jpg|jpeg|png|gif|ico|svg|webp|avif)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
