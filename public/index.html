<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ateliê Digital - Landing Page</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f7f3ed;
      color: #1f1f1f;
    }
    .wrap {
      max-width: 920px;
      margin: 0 auto;
      padding: 56px 20px;
    }
    .card {
      background: white;
      border-radius: 24px;
      padding: 40px;
      box-shadow: 0 20px 60px rgba(0,0,0,.08);
    }
    h1 {
      font-size: 42px;
      margin: 0 0 16px;
    }
    p {
      font-size: 18px;
      line-height: 1.6;
    }
    .btn {
      display: inline-block;
      margin-top: 20px;
      padding: 14px 22px;
      background: #111;
      color: white;
      text-decoration: none;
      border-radius: 999px;
      font-weight: 700;
    }
    .note {
      margin-top: 28px;
      font-size: 14px;
      color: #666;
    }
  </style>
</head>
<body>
  <main class="wrap">
    <section class="card">
      <h1>Landing page funcionando.</h1>
      <p>Base inicial para negócios locais: costureira, salão, restaurante, pet shop e serviços por WhatsApp.</p>
      <a class="btn" href="https://wa.me/5500000000000">Pedir orçamento pelo WhatsApp</a>
      <div class="note">Deploy via Docker + Nginx + Dokploy.</div>
    </section>
  </main>
</body>
</html>
